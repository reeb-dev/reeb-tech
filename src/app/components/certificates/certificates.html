<section id="certificados" class="py-24 bg-sand dark:bg-dark-alt transition-colors duration-300">
  <div class="container-custom">
    <div class="max-w-2xl mx-auto text-center mb-16">
      <h2 class="heading-lg mb-4 text-gray-900 dark:text-white">{{ i18n.t().certificates.title }}</h2>
      <p class="text-lg text-subtle dark:text-subtle-dark">
        {{ i18n.t().certificates.subtitle }}
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <a
        *ngFor="let cert of i18n.t().certificates.items"
        [href]="cert.url"
        target="_blank"
        rel="noopener"
        class="group flex flex-col p-6 rounded-xl border border-line dark:border-line-dark hover:border-brand dark:hover:border-brand-dark transition-all duration-200 bg-surface dark:bg-surface-dark"
      >
        <div class="flex items-center justify-between gap-2 mb-4">
          <span class="text-xs font-semibold uppercase tracking-wide text-subtle dark:text-subtle-dark">
            {{ i18n.t().certificates.issuer }}
          </span>
          <span class="text-xs font-mono text-brand dark:text-brand-dark bg-brand/10 px-2 py-1 rounded">
            {{ cert.level }}
          </span>
        </div>

        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2 group-hover:text-brand dark:group-hover:text-brand-dark transition-colors">
          {{ cert.name }}
        </h3>
        <p *ngIf="cert.note" class="text-xs text-subtle dark:text-subtle-dark mb-2 leading-relaxed">
          {{ cert.note }}
        </p>
        <p *ngIf="cert.issued" class="text-sm font-semibold text-brand dark:text-brand-dark mb-3">{{ cert.issued }}</p>
        <p class="text-sm text-subtle dark:text-subtle-dark leading-relaxed flex-1">
          {{ cert.summary }}
        </p>
        <span class="mt-6 pt-4 border-t border-line dark:border-line-dark text-sm font-medium text-brand dark:text-brand-dark">
          {{ i18n.t().certificates.verify }} →
        </span>
      </a>
    </div>
  </div>
</section>
