<section id="experiencia" class="section-padding bg-cream dark:bg-dark-secondary border-b border-line dark:border-line-dark transition-colors duration-300">
  <div class="container-custom">
    <div class="max-w-2xl mx-auto text-center mb-16">
      <h2 class="heading-lg mb-4 text-gray-900 dark:text-white">
        {{ i18n.t().companies.title }}
      </h2>
      <p class="text-lg text-muted">
        {{ i18n.t().companies.subtitle }}
      </p>
    </div>

    <div class="flex flex-wrap justify-center gap-8">
      <div *ngFor="let company of i18n.t().companies.items" class="group p-8 rounded-xl border border-line dark:border-line-dark hover:border-brand dark:hover:border-brand-dark hover:shadow-lg dark:hover:shadow-none transition-all duration-300 bg-gradient-to-br from-sand to-surface dark:from-dark dark:to-dark-secondary w-full md:w-80">
        <div
          class="logo-well group-hover:scale-105 transition-transform duration-300"
          [attr.data-well]="logoWell(company)"
        >
          <ng-container *ngIf="company.logo">
            <img
              [src]="company.logo"
              [alt]="company.name"
              [attr.width]="logoWell(company) === 'indra' ? 738 : (logoWell(company) === 'siskit' ? 160 : 128)"
              [attr.height]="logoWell(company) === 'indra' ? 224 : (logoWell(company) === 'siskit' ? 196 : 128)"
              loading="lazy"
              decoding="async"
              [ngClass]="company.logoExtra ? 'h-16 w-16 shrink-0 object-contain' : (logoWell(company) === 'indra' ? 'h-full w-full object-cover' : 'max-h-[4.75rem] max-w-[78%] object-contain')"
            >
            <img
              *ngIf="company.logoExtra"
              [src]="company.logoExtra"
              alt=""
              width="126"
              height="64"
              loading="lazy"
              decoding="async"
              class="h-16 w-auto max-h-16 max-w-[58%] object-contain"
            >
          </ng-container>
          <span
            *ngIf="!company.logo"
            class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white"
          >{{ company.initials }}</span>
        </div>

        <div class="space-y-3">
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ company.name }}</h3>
          <p class="text-sm font-medium text-subtle dark:text-subtle-dark">{{ company.role }}</p>
          <p class="text-sm font-semibold text-brand dark:text-brand-dark">
            {{ company.years }}
          </p>
          <p class="text-sm text-subtle dark:text-subtle-dark leading-relaxed">
            {{ company.description }}
          </p>
        </div>

        <div class="mt-6 pt-6 border-t border-line dark:border-line-dark">
          <span
            class="inline-block px-3 py-1 bg-brand/10 text-brand dark:text-brand-dark text-xs font-semibold rounded-full"
          >
            {{ company.current ? i18n.t().companies.current : i18n.t().companies.past }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
