<section id="contact" class="py-24 bg-white dark:bg-[#0A0A0B] transition-colors duration-300">
  <div class="container-custom">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-12">
        <h2 class="heading-lg mb-4 text-gray-900 dark:text-white">{{ i18n.t().contact.title }}</h2>
        <p class="text-lg text-[#94A3B8] mb-6">
          {{ i18n.t().contact.subtitle }}
        </p>
        <a
          [href]="i18n.t().demos.hubUrl"
          class="inline-flex items-center justify-center px-8 py-3 bg-[#1D4ED8] hover:bg-[#1E40AF] text-white font-semibold rounded-lg transition-all duration-200 shadow-md hover:shadow-lg"
        >
          {{ i18n.t().contact.viewDemos }}
        </a>
      </div>

      <div class="bg-gray-50 dark:bg-[#020617] rounded-xl border border-[#E5E7EB] dark:border-[#1E293B] p-8">
        <div class="mb-8">
          <label class="block text-sm font-mono text-[#3B82F6] uppercase tracking-widest mb-4">{{ i18n.t().contact.whatNeed }}</label>
          <div class="space-y-3">
            <label *ngFor="let interest of i18n.t().contact.interests" class="flex items-center gap-3 cursor-pointer group">
              <input
                type="checkbox"
                [(ngModel)]="checked[interest.id]"
                class="w-5 h-5 rounded border-[#E5E7EB] dark:border-[#1E293B] text-[#3B82F6] focus:ring-[#3B82F6] bg-white dark:bg-[#0A0A0B]"
              >
              <span class="text-[#94A3B8] group-hover:text-gray-900 dark:group-hover:text-white transition-colors">{{ interest.label }}</span>
            </label>
          </div>
        </div>

        <div class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">{{ i18n.t().contact.name }}</label>
              <input
                type="text"
                [(ngModel)]="name"
                [placeholder]="i18n.t().contact.namePlaceholder"
                class="w-full px-4 py-3 rounded-lg border border-[#E5E7EB] dark:border-[#1E293B] bg-white dark:bg-[#0A0A0B] text-gray-900 dark:text-white placeholder-[#94A3B8] focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6] transition-colors"
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">{{ i18n.t().contact.email }}</label>
              <input
                type="email"
                [(ngModel)]="email"
                placeholder="you@email.com"
                class="w-full px-4 py-3 rounded-lg border border-[#E5E7EB] dark:border-[#1E293B] bg-white dark:bg-[#0A0A0B] text-gray-900 dark:text-white placeholder-[#94A3B8] focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6] transition-colors"
              >
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-900 dark:text-white mb-2">{{ i18n.t().contact.message }}</label>
            <textarea
              [(ngModel)]="message"
              rows="4"
              [placeholder]="i18n.t().contact.messagePlaceholder"
              class="w-full px-4 py-3 rounded-lg border border-[#E5E7EB] dark:border-[#1E293B] bg-white dark:bg-[#0A0A0B] text-gray-900 dark:text-white placeholder-[#94A3B8] focus:border-[#3B82F6] focus:ring-1 focus:ring-[#3B82F6] transition-colors resize-none"
            ></textarea>
          </div>

          <a
            [href]="getMailtoLink()"
            class="w-full inline-flex items-center justify-center gap-2 px-8 py-4 bg-[#3B82F6] hover:bg-[#1D4ED8] text-white font-semibold rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl hover:scale-[1.02]"
          >
            <span>{{ i18n.t().contact.send }}</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </a>
        </div>

        <div class="mt-8 pt-8 border-t border-[#E5E7EB] dark:border-[#1E293B]">
          <p class="text-sm text-[#94A3B8] text-center mb-4">{{ i18n.t().contact.orDirect }}</p>
          <div class="flex flex-wrap justify-center gap-4">
            <a href="mailto:manuelreeb@icloud.com" class="text-sm text-[#3B82F6] hover:underline">manuelreeb@icloud.com</a>
            <span class="text-[#94A3B8]">•</span>
            <a href="https://www.linkedin.com/in/manuel-jesus-reeb/" target="_blank" class="text-sm text-[#3B82F6] hover:underline">LinkedIn</a>
            <span class="text-[#94A3B8]">•</span>
            <a href="https://github.com/reeb-dev" target="_blank" class="text-sm text-[#3B82F6] hover:underline">GitHub</a>
            <span class="text-[#94A3B8]">•</span>
            <a [href]="i18n.t().demos.hubUrl" class="text-sm text-[#3B82F6] hover:underline">{{ i18n.t().contact.viewDemos }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
