server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: arautos
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arautos}
    username: ${DATABASE_USER:arautos}
    password: ${DATABASE_PASSWORD:arautos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

arautos:
  jwt:
    secret: ${ARAUTOS_JWT_SECRET:arautos-dev-secret-change-me-32chars-min!!}
    expiration-ms: ${ARAUTOS_JWT_EXPIRATION_MS:86400000}
  trial-days: ${ARAUTOS_TRIAL_DAYS:14}
  # Placeholders de plan — NO montos públicos inventados
  plan:
    id: ${ARAUTOS_PLAN_ID:starter}
    name: ${ARAUTOS_PLAN_NAME:Starter}
    price-usd: ${ARAUTOS_PLAN_PRICE_USD:}
    price-ars: ${ARAUTOS_PLAN_PRICE_ARS:}
  mercado-pago:
    enabled: ${ARAUTOS_MP_ENABLED:false}
    access-token: ${ARAUTOS_MP_ACCESS_TOKEN:}
    public-key: ${ARAUTOS_MP_PUBLIC_KEY:}
    webhook-secret: ${ARAUTOS_MP_WEBHOOK_SECRET:}
    success-url: ${ARAUTOS_MP_SUCCESS_URL:http://localhost:4200/panel?mp=success}
    pending-url: ${ARAUTOS_MP_PENDING_URL:http://localhost:4200/panel?mp=pending}
    failure-url: ${ARAUTOS_MP_FAILURE_URL:http://localhost:4200/panel?mp=failure}
    notification-url: ${ARAUTOS_MP_NOTIFICATION_URL:http://localhost:8080/api/public/mp/webhook}
  # Facebook Login (cuenta) ≠ Meta Connect (páginas/IG por tenant). Sin secret = botones apagados.
  facebook-oauth:
    enabled: ${ARAUTOS_OAUTH_FACEBOOK_ENABLED:false}
    client-id: ${ARAUTOS_OAUTH_FACEBOOK_CLIENT_ID:}
    client-secret: ${ARAUTOS_OAUTH_FACEBOOK_CLIENT_SECRET:}
    login-redirect-uri: ${ARAUTOS_OAUTH_FACEBOOK_REDIRECT_URI:http://localhost:8080/api/auth/oauth/facebook/callback}
    connect-redirect-uri: ${ARAUTOS_OAUTH_META_CONNECT_REDIRECT_URI:http://localhost:8080/api/panel/social/meta/callback}
    frontend-login-success-url: ${ARAUTOS_OAUTH_FRONTEND_LOGIN_URL:http://localhost:4200/panel/oauth/callback}
    frontend-connect-success-url: ${ARAUTOS_OAUTH_FRONTEND_CONNECT_URL:http://localhost:4200/panel?meta=connected}
    frontend-connect-select-url: ${ARAUTOS_OAUTH_FRONTEND_SELECT_URL:http://localhost:4200/panel?meta=select}
    graph-version: ${ARAUTOS_OAUTH_GRAPH_VERSION:v21.0}
  google-oauth:
    enabled: ${ARAUTOS_OAUTH_GOOGLE_ENABLED:false}
    client-id: ${ARAUTOS_OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${ARAUTOS_OAUTH_GOOGLE_CLIENT_SECRET:}
    # Debe coincidir EXACTO con Authorized redirect URIs en Google Cloud (sin slash final).
    redirect-uri: ${ARAUTOS_OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
    frontend-success-url: ${ARAUTOS_OAUTH_FRONTEND_LOGIN_URL:http://localhost:4200/panel/oauth/callback}
  public-base-url: ${ARAUTOS_PUBLIC_BASE_URL:http://localhost:4200}
  cors-origins: ${ARAUTOS_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  seed: ${ARAUTOS_SEED:true}

logging:
  level:
    org.springframework.security: INFO
