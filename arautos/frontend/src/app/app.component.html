<header class="top">
  <div class="container top-inner">
    <a class="brand" routerLink="/" aria-label="ArAutos — inicio">
      <img
        class="logo-malvinas"
        src="/assets/logo-malvinas-ar.svg"
        width="90"
        height="56"
        alt="Islas Malvinas con la bandera argentina"
      />
      <span class="brand-text">
        <strong>ArAutos</strong>
        <small>Autos en Argentina</small>
      </span>
    </a>
    <nav aria-label="Principal">
      <a class="nav-link" routerLink="/">Catálogo</a>
      <a class="nav-cta" routerLink="/panel">Mi concesionaria</a>
    </nav>
  </div>
  <div class="lema-bar" aria-label="Afirmación soberana">
    <div class="container">
      <span class="lema-line">{{ lemaMalvinas() }}</span>
    </div>
  </div>
</header>
<main>
  <router-outlet />
</main>
<footer class="foot">
  <div class="container foot-inner">
    <span>ArAutos — catálogo de concesionarias en Argentina</span>
    <span class="malvinas" aria-label="Afirmación soberana">{{ lemaMalvinas() }}</span>
  </div>
</footer>
