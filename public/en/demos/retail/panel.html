<body>
  <script src="/demos/login.js?v=5" data-rubro="comercio" data-place="panel" data-lang="en"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo market-logo" href="index.html">
          <span class="market-mark" aria-hidden="true">LE</span>
          <span>LA ESQUINA<small>Market admin panel</small></span>
        </a>
        <nav>
          <a class="store-link" href="index.html">← View public website</a>
          <a class="store-link" href="/demos/comercio/panel.html" hreflang="es-AR">ES</a>
          <div class="panel-tabs" id="tabs">
            <button type="button" data-tab="pedido" class="on">Orders</button>
            <button type="button" data-tab="faltante">Shortages</button>
            <button type="button" data-tab="caja">Cash</button>
          </div>
          <button class="btn" id="open-create" type="button">New order</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="kicker">Today’s operation · sample data</p>
        <h1 id="panelTitle">Supplier orders</h1>
      </div>
      <input type="search" id="search" class="search-input" placeholder="Search ticket, supplier or item">
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create-pedido">
      <input name="ticket" placeholder="Ticket (PED-453)" required>
      <input name="origin" placeholder="Supplier" required>
      <input name="due" placeholder="When (today, 7:00 AM)">
      <input name="item" placeholder="First item" required>
      <input name="qty" type="number" min="0" value="1">
      <button class="btn" type="submit">Add order</button>
    </form>

    <form class="create" id="create-faltante">
      <input name="ticket" placeholder="Ticket (GON-22)" required>
      <input name="origin" placeholder="Aisle or shelf" required>
      <input name="item" placeholder="Missing product" required>
      <input name="qty" type="number" min="0" value="1" placeholder="Ordered">
      <input name="missing" type="number" min="0" value="1" placeholder="Missing">
      <button class="btn" type="submit">Add shortage</button>
    </form>

    <form class="create" id="create-caja">
      <input name="ticket" placeholder="Ticket (CAJA-HOY)" required>
      <input name="origin" placeholder="Register 1" required>
      <input name="due" placeholder="Shift" value="Today">
      <input name="efectivo" type="number" placeholder="Cash" required>
      <input name="tarjetas" type="number" placeholder="Cards" required>
      <input name="contado" type="number" placeholder="Counted cash" required>
      <button class="btn" type="submit">Close reconciliation</button>
    </form>

    <div class="layout">
      <section class="tickets" id="tickets"></section>
      <aside class="sheet" id="sheet"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>

</body>
</html>
