<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · Web con REEB</title>
  <meta name="description" content="No encontramos esa dirección. Volvé al catálogo de ejemplos por rubro.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://webconreeb.com/">
  <link rel="icon" href="/brand/reeb-mark.svg?v=20260911force" type="image/svg+xml">
  <link rel="icon" href="/brand/hub-mark.ico?v=20260911force" sizes="any">
  <link rel="shortcut icon" href="/brand/hub-mark.ico?v=20260911force">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f4efe6;
      --muted: rgba(244, 239, 230, 0.72);
      --gold: #e3c48a;
      --ember: #c45c2e;
      --bg: #0e0c0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(196, 92, 46, 0.22), transparent 50%),
        var(--bg);
      font-family: Outfit, system-ui, sans-serif;
    }
    main {
      max-width: 34rem;
      text-align: center;
    }
    p.kicker {
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin: 0 0 0.85rem;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      font-weight: 560;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    p.lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }
    a.btn-primary {
      background: var(--ember);
      color: #fff;
    }
    a.btn-ghost {
      border: 1px solid rgba(227, 196, 138, 0.35);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Error 404</p>
    <h1>No encontramos esa página</h1>
    <p class="lead">El enlace puede estar mal escrito o la página ya no está. Volvé al catálogo de ejemplos por rubro.</p>
    <div class="ctas">
      <a class="btn btn-primary" href="/">Ir al catálogo</a>
      <a class="btn btn-ghost" href="/#precios">Ver precios</a>
    </div>
  </main>
</body>
</html>
