<body class="sys-reservas">
<header class="app-top">
  <a class="back" href="/demos/#sistemas-gestion">← Catálogo</a>
  <div><strong>Ocupación</strong><span>Unidades, fechas y seña</span></div>
  <a class="btn" href="panel.html">Panel completo</a>
</header>
<main id="app" class="app-shell"></main>
<script src="data.js"></script>
<script>

window.SIS_STORAGE_KEY = "sistema-reservas-v3";
var seed = window.RESERVAS_SEED || {};
window.SIS_SEED = {
  items: (seed.reservas || []).map(function (r) {
    var u = (seed.unidades || []).filter(function (x) { return x.id === r.unidadId; })[0] || {};
    var estado = r.estado === "reservada" ? "confirmada" : r.estado === "ocupada" ? "checkin" : r.estado === "cerrada" ? "checkout" : r.estado;
    return {
      id: r.id,
      nombre: r.huesped,
      desde: r.desde,
      hasta: r.hasta,
      unidad: u.nombre || "",
      estado: estado,
      sena: r.sena
    };
  }),
  unidades: seed.unidades || []
};
window.SIS_CFG = {
  slug: "reservas", listKey: "items",
  statuses: ["consulta", "confirmada", "checkin", "checkout", "cancelada"],
  statusLabels: { consulta: "Consulta", confirmada: "Confirmada", checkin: "Check-in", checkout: "Check-out", cancelada: "Cancelada" },
  columns: [["nombre", "Huésped"], ["unidad", "Unidad"], ["desde", "Desde"], ["hasta", "Hasta"], ["estado", "Estado"]],
  form: [["nombre", "Huésped", "text"], ["desde", "Desde", "text"], ["hasta", "Hasta", "text"], ["unidad", "Unidad", "text"]],
  row: ["nombre", "estado"]
};

</script>
<script src="../sistemas-ui/mini-app.js?v=c20"></script>
<script src="../wa-float.js?v=wa8"></script>
</body>
</html>
