<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sistemas-ui/base.css?v=c2">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">
  <script src="../login.js?v=2" data-rubro="reservas" data-place="panel"></script>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="index.html"><strong>Reservas</strong><span>Panel de ejemplo</span></a>
      <nav>
        <a href="index.html">Qué es</a>
        <button class="btn" id="open-create" type="button">Nueva reserva</button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar"><div><p class="kicker">Datos de ejemplo</p><h1>Reservas</h1></div></div>
    <p class="hint-bar"><strong>Ejemplo en el navegador.</strong> Clave de acceso: <strong>demo</strong>. <button type="button" id="reset-sample" style="margin-left:0.5rem;font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0.25rem 0.55rem">Restablecer ejemplo</button></p>
    <div class="thumb-row"><img src="img/unidad-1.jpg" alt=""><img src="img/unidad-2.jpg" alt=""><img src="img/unidad-3.jpg" alt=""></div>
    <div class="stats" id="stats"></div>
    <div class="filters-row" id="filters"></div>

    <form class="create" id="create" hidden>
      <label>Unidad
        <select name="unidad"></select>
      </label>
      <label>Huésped<input name="huesped" required></label>
      <label>Desde<input name="desde" type="date" required></label>
      <label>Hasta<input name="hasta" type="date" required></label>
      <label>Seña<input name="sena" type="number" min="0" value="0"></label>
      <label class="full">Notas<input name="notas"></label>
      <button type="submit">Guardar reserva</button>
    </form>
    <div class="workspace">
      <section class="list"><div class="table-scroll"><table>
        <thead><tr><th>Unidad</th><th>Huésped</th><th>Fechas</th><th class="amount">Seña</th><th>Estado</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div></section>
      <aside class="sheet" id="sheet"><p>Elija una reserva.</p></aside>
    </div>
  </div>
  <div id="contacto"></div>
  <footer class="wrap">Reservas · ejemplo · clave demo.</footer>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un sistema de reservas" data-subject="Consulta — Reservas" data-title="Consultar" data-place="panel"></script>
</body></html>
