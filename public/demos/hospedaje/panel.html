<body>
  <script src="../login.js?v=4" data-rubro="hospedaje" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">DEL SAUCE<small>Cabañas · panel</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <div class="panel-tabs">
            <button type="button" id="tab-reservas" class="on">Reservas</button>
            <button type="button" id="tab-habitaciones">Habitaciones</button>
          </div>
          <button class="btn" id="open-create" type="button">Nueva reserva</button>
        </nav>
      </div>
    </header>

    <div id="view-reservas">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Datos de ejemplo</p>
          <h1>Reservas y check-in</h1>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <form class="create" id="create">
        <select name="habitacion" required></select>
        <input name="checkin" type="date" required>
        <input name="checkout" type="date" required>
        <input name="cliente" placeholder="Huésped" required>
        <input name="tel" placeholder="Teléfono">
        <input name="huespedes" type="number" min="1" max="8" value="2" placeholder="Huéspedes">
        <input name="notas" placeholder="Notas">
        <button class="btn-panel" type="submit">Guardar reserva</button>
      </form>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Estadía</th>
                <th>Huésped</th>
                <th>Unidad</th>
                <th class="amount">Total</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <div id="view-habitaciones" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Carta de la landing</p>
          <h1>Habitaciones publicadas</h1>
        </div>
        <button class="btn" id="open-hab" type="button">Nueva unidad</button>
      </div>
      <form class="create" id="create-hab">
        <input name="nombre" placeholder="Nombre" required>
        <select name="tipo">
          <option value="cabana">Cabaña</option>
          <option value="suite">Suite</option>
          <option value="depto">Departamento</option>
        </select>
        <input name="precio" type="number" placeholder="Precio / noche" required>
        <input name="pax" type="number" placeholder="Huéspedes" required>
        <input name="metros" type="number" placeholder="m²">
        <select name="imagen">
          <option value="img/arroyo.jpg">Arroyo</option>
          <option value="img/cerro-ventana.jpg">Cerro Ventana</option>
          <option value="img/suite.jpg">Suite</option>
          <option value="img/loft.jpg">Loft</option>
          <option value="img/cabana.jpg">Cabaña</option>
          <option value="img/villa-ventana.jpg">Pueblo</option>
        </select>
        <textarea name="descripcion" placeholder="Descripción"></textarea>
        <input name="amenities" placeholder="Amenities (coma)">
        <button class="btn-panel" type="submit">Guardar unidad</button>
      </form>
      <div class="trabajos-grid" id="habGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=2" data-rubro="hospedaje" data-place="panel"></script>
  <script src="../contacto.js?v=wa8" data-phone="5492915757934" data-text="Hola, vi el ejemplo de hospedaje y quiero consultar una página web a medida para mi local" data-subject="Consulta — página web (hospedaje)" data-title="Consultar estadía" data-place="panel"></script>
</body>
</html>
