<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Taller Mecánico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">TALLER<small>Gestión de vehículos · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nueva orden</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Órdenes de trabajo</h1>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="marca" placeholder="Marca" required>
      <input name="modelo" placeholder="Modelo" required>
      <input name="año" type="number" placeholder="Año">
      <input name="patente" placeholder="Patente" required>
      <input name="km" type="number" placeholder="Kilometraje">
      <input name="cliente" placeholder="Nombre cliente" required>
      <input name="tel" placeholder="Teléfono">
      <select name="tipo">
        <option value="service">Service</option>
        <option value="mecanica">Mecánica general</option>
        <option value="electricidad">Electricidad</option>
        <option value="frenos">Frenos</option>
        <option value="suspension">Suspensión</option>
        <option value="tren">Tren delantero</option>
        <option value="chapa">Chapa y pintura</option>
        <option value="otro">Otro</option>
      </select>
      <input name="descripcion" placeholder="Descripción del trabajo">
      <button class="btn-panel" type="submit">Crear orden</button>
    </form>

    <div class="workspace">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Orden</th>
              <th>Vehículo</th>
              <th>Cliente</th>
              <th>Trabajo</th>
              <th class="amount">Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por un turno o un service" data-subject="Consulta demo — Taller" data-title="Pedir un turno" data-place="panel"></script>
</body>
</html>
