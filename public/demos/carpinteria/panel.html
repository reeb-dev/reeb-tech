<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Carpintería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">CARPINTERÍA<small>Muebles a medida · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo pedido</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Pedidos del taller</h1>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="cliente" placeholder="Nombre cliente" required>
      <input name="tel" placeholder="Teléfono">
      <input name="direccion" placeholder="Dirección">
      <select name="tipo">
        <option value="placard">Placard</option>
        <option value="cocina">Mueble de cocina</option>
        <option value="escritorio">Escritorio</option>
        <option value="biblioteca">Biblioteca</option>
        <option value="mesa">Mesa</option>
        <option value="cama">Cama/Respaldo</option>
        <option value="rack">Rack/Mueble TV</option>
        <option value="vestidor">Vestidor</option>
        <option value="otro">Otro</option>
      </select>
      <input name="medidas" placeholder="Medidas">
      <textarea name="descripcion" placeholder="Descripción del mueble"></textarea>
      <button class="btn-panel" type="submit">Crear pedido</button>
    </form>

    <div class="workspace">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Pedido</th>
              <th>Cliente</th>
              <th>Mueble</th>
              <th>Entrega</th>
              <th class="amount">Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
