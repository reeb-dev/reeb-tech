<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Vendedor — MercadoDemo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>body { font-family: "Nunito Sans", "Segoe UI", sans-serif; }</style>
</head>
<body class="app">

  <header class="panel-header">
    <div class="inner">
      <a href="index.html" class="logo">MercadoDemo <small>Panel Vendedor</small></a>
      <nav>
        <button type="button" data-nav-tab="ventas">Ventas</button>
        <button type="button" data-nav-tab="publicaciones">Publicaciones</button>
        <button type="button" data-nav-tab="preguntas">Mensajes</button>
        <button type="button" data-nav-tab="mercadopago">Mercado Pago</button>
        <button type="button" data-nav-tab="facturacion">Facturación</button>
        <div class="notif-wrap">
          <button type="button" class="notif-btn" id="notif-btn" aria-label="Notificaciones">
            🔔
            <span class="notif-badge" id="notif-badge" hidden>0</span>
          </button>
          <div class="notif-dropdown" id="notif-dropdown" hidden></div>
        </div>
      </nav>
    </div>
  </header>

  <div class="toolbar">
    <div>
      <span class="eyebrow">Panel de Vendedor</span>
      <h1 id="toolbar-title">Mis Publicaciones</h1>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="ghost" id="open-create">+ Nueva publicación</button>
      <a href="index.html" class="btn-panel">Ver tienda</a>
    </div>
  </div>

  <div class="tabs">
    <button type="button" data-tab="publicaciones" class="on">Publicaciones</button>
    <button type="button" data-tab="ventas">Ventas</button>
    <button type="button" data-tab="preguntas">Preguntas</button>
    <button type="button" data-tab="envios">Envíos</button>
    <button type="button" data-tab="calificaciones">Calificaciones</button>
    <button type="button" data-tab="mercadopago">Mercado Pago</button>
    <button type="button" data-tab="facturacion">Facturación ARCA</button>
  </div>

  <div class="stats" id="stats"></div>

  <form class="create" id="create">
    <h3>Nueva Publicación</h3>
    <div class="create-grid">
      <div>
        <label>Título del producto</label>
        <input type="text" name="titulo" placeholder="Ej: iPhone 15 Pro 256GB Negro" required>
      </div>
      <div>
        <label>Categoría</label>
        <select name="categoria">
          <option value="celulares">Celulares</option>
          <option value="computacion">Computación</option>
          <option value="electronica">Electrónica</option>
          <option value="electrodomesticos">Electrodomésticos</option>
          <option value="hogar">Hogar</option>
          <option value="deportes">Deportes</option>
          <option value="moda">Moda</option>
        </select>
      </div>
      <div>
        <label>Precio</label>
        <input type="number" name="precio" placeholder="0" required>
      </div>
      <div>
        <label>Stock disponible</label>
        <input type="number" name="stock" value="1" min="0">
      </div>
      <div>
        <label>Ubicación</label>
        <input type="text" name="ubicacion" value="Capital Federal">
      </div>
      <div>
        <label>Tipo de publicación</label>
        <select name="tipoPub">
          <option value="gratuita">Gratuita</option>
          <option value="clasica">Clásica (13%)</option>
          <option value="premium">Premium (17%)</option>
        </select>
      </div>
    </div>
    <div style="margin-top: 12px;">
      <label>Descripción</label>
      <textarea rows="3" name="descripcion" placeholder="Describí tu producto con detalle..."></textarea>
    </div>
    <div style="margin-top: 12px;">
      <label><input type="checkbox" name="envioGratis" checked> Envío gratis</label>
    </div>
    <button type="submit" class="btn-panel" style="margin-top: 12px;">Publicar producto</button>
  </form>

  <div class="workspace" id="workspace">
    <div class="list" id="publist"></div>
    <div class="detail" id="detail">
      <p>Elegí una publicación del listado.</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por una publicación" data-subject="Consulta demo — Marketplace" data-title="Consultar" data-place="panel"></script>
</body>
</html>
