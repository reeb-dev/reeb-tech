<script>

<body class="app">
  <script src="../login.js?v=4" data-rubro="marketplace" data-place="panel"></script>

  <header class="panel-header">
    <div class="inner">
      <a href="index.html" class="logo">Feria <small>Panel vendedor</small></a>
      <nav>
        <button type="button" data-nav-tab="ventas">Ventas</button>
        <button type="button" data-nav-tab="publicaciones">Publicaciones</button>
        <button type="button" data-nav-tab="preguntas">Preguntas</button>
        <button type="button" data-nav-tab="billetera">Billetera</button>
        <button type="button" data-nav-tab="facturacion">Facturación</button>
        <div class="notif-wrap">
          <button type="button" class="notif-btn" id="notif-btn" aria-label="Notificaciones">
            🔔
            <span class="notif-badge" id="notif-badge" hidden>0</span>
          </button>
          <div class="notif-dropdown" id="notif-dropdown" hidden></div>
        </div>
      </nav>
    </div>
  </header>

  <div class="toolbar">
    <div>
      <span class="eyebrow">Mostrador del vendedor</span>
      <h1 id="toolbar-title">Mis publicaciones</h1>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="ghost" id="open-create">+ Nueva publicación</button>
      <a href="index.html" class="btn-panel">Ver Feria</a>
    </div>
  </div>

  <div class="tabs">
    <button type="button" data-tab="publicaciones" class="on">Publicaciones</button>
    <button type="button" data-tab="ventas">Ventas</button>
    <button type="button" data-tab="preguntas">Preguntas</button>
    <button type="button" data-tab="envios">Envíos</button>
    <button type="button" data-tab="calificaciones">Calificaciones</button>
    <button type="button" data-tab="billetera">Billetera</button>
    <button type="button" data-tab="facturacion">Facturación ARCA</button>
  </div>

  <div class="stats" id="stats"></div>

  <form class="create" id="create">
    <h3>Nueva publicación</h3>
    <div class="create-grid">
      <div>
        <label>Título del producto</label>
        <input type="text" name="titulo" placeholder="Ej: Cámara usada con estuche" required>
      </div>
      <div>
        <label>Categoría</label>
        <select name="categoria">
          <option value="celulares">Celulares</option>
          <option value="computacion">Computación</option>
          <option value="electronica">Electrónica</option>
          <option value="electrodomesticos">Electrodomésticos</option>
          <option value="hogar">Hogar</option>
          <option value="deportes">Deportes</option>
          <option value="moda">Moda</option>
        </select>
      </div>
      <div>
        <label>Precio</label>
        <input type="number" name="precio" placeholder="0" required>
      </div>
      <div>
        <label>Stock disponible</label>
        <input type="number" name="stock" value="1" min="0">
      </div>
      <div>
        <label>Ubicación</label>
        <input type="text" name="ubicacion" value="Capital Federal">
      </div>
      <div>
        <label>Foto</label>
        <select name="imagen"></select>
      </div>
    </div>
    <div style="margin-top: 12px;">
      <label>Descripción</label>
      <textarea rows="3" name="descripcion" placeholder="Estado, extras, cómo se entrega…"></textarea>
    </div>
    <div style="margin-top: 12px;">
      <label><input type="checkbox" name="envioGratis" checked> Envío incluido</label>
    </div>
    <button type="submit" class="btn-panel" style="margin-top: 12px;">Publicar en Feria</button>
  </form>

  <div class="workspace" id="workspace">
    <div class="list" id="publist"></div>
    <div class="detail" id="detail">
      <p>Elegí una publicación del listado.</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=3" data-rubro="marketplace" data-place="panel"></script>
  <script src="../contacto.js?v=wa8" data-phone="5492915757934" data-text="Hola, vi el ejemplo de marketplace y quiero consultar una página web a medida para mi local" data-subject="Consulta — página web (marketplace)" data-title="Consultar" data-place="panel"></script>
</body>
</html>
