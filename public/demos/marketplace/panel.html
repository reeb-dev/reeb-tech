<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Vendedor — MercadoDemo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>body { font-family: "Nunito Sans", "Segoe UI", sans-serif; }</style>
</head>
<body class="app">

  <!-- Panel Header -->
  <header class="panel-header">
    <div class="inner">
      <a href="index.html" class="logo">MercadoDemo <small>Panel Vendedor</small></a>
      <nav>
        <a href="#">Ventas</a>
        <a href="#">Publicaciones</a>
        <a href="#">Mensajes</a>
        <a href="#">Métricas</a>
        <a href="#">Facturación</a>
        <a href="#">Cuenta</a>
      </nav>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div>
      <span class="eyebrow">Panel de Vendedor</span>
      <h1>Mis Publicaciones</h1>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="ghost" id="open-create">+ Nueva publicación</button>
      <a href="index.html" class="btn-panel">Ver tienda</a>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="on">Publicaciones</button>
    <button>Ventas</button>
    <button>Preguntas</button>
    <button>Envíos</button>
    <button>Calificaciones</button>
    <button>Mercado Pago</button>
    <button>Facturación</button>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Create form -->
  <form class="create" id="create">
    <h3>Nueva Publicación</h3>
    <div class="create-grid">
      <div>
        <label>Título del producto</label>
        <input type="text" name="titulo" placeholder="Ej: iPhone 15 Pro 256GB Negro" required>
      </div>
      <div>
        <label>Categoría</label>
        <select name="categoria">
          <option value="celulares">Celulares</option>
          <option value="computacion">Computación</option>
          <option value="electronica">Electrónica</option>
          <option value="electrodomesticos">Electrodomésticos</option>
          <option value="hogar">Hogar</option>
          <option value="deportes">Deportes</option>
          <option value="moda">Moda</option>
        </select>
      </div>
      <div>
        <label>Precio</label>
        <input type="number" name="precio" placeholder="0" required>
      </div>
      <div>
        <label>Stock disponible</label>
        <input type="number" name="stock" value="1" min="0">
      </div>
      <div>
        <label>Ubicación</label>
        <input type="text" name="ubicacion" value="Capital Federal">
      </div>
      <div>
        <label>Tipo de publicación</label>
        <select name="tipoPub">
          <option value="gratuita">Gratuita</option>
          <option value="clasica">Clásica (13%)</option>
          <option value="premium">Premium (17%)</option>
        </select>
      </div>
    </div>
    <div style="margin-top: 12px;">
      <label>Descripción</label>
      <textarea rows="3" name="descripcion" placeholder="Describí tu producto con detalle..."></textarea>
    </div>
    <div style="margin-top: 12px;">
      <label><input type="checkbox" name="envioGratis" checked> Envío gratis</label>
    </div>
    <button type="submit" class="btn-panel" style="margin-top: 12px;">Publicar producto</button>
  </form>

  <!-- Workspace -->
  <div class="workspace">
    <!-- List -->
    <div class="list" id="publist"></div>

    <!-- Detail -->
    <div class="detail" id="detail">
      <p>Elegí una publicación del listado.</p>
    </div>
  </div>

  <style>
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
