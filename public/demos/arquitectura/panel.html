<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Estudio Loma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">Estudio Loma<small>Obras · panel</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <div class="panel-tabs">
            <button type="button" id="tab-obras" class="on">Obras</button>
            <button type="button" id="tab-clientes">Clientes</button>
            <button type="button" id="tab-arca">ARCA</button>
          </div>
          <button class="btn" id="open-create" type="button">Nueva obra</button>
        </nav>
      </div>
    </header>

    <div id="view-obras">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Datos de ejemplo</p>
          <h1>Obras del estudio</h1>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <form class="create" id="create">
        <input name="cliente" placeholder="Nombre cliente" required>
        <input name="tel" placeholder="Teléfono">
        <input name="titulo" placeholder="Título de la obra" required>
        <select name="tipo">
          <option value="casa">Casa nueva</option>
          <option value="reforma">Reforma</option>
          <option value="ph">PH</option>
          <option value="departamento">Departamento</option>
        </select>
        <input name="direccion" placeholder="Dirección">
        <input name="superficie" placeholder="Superficie">
        <button class="btn-panel" type="submit">Crear obra</button>
      </form>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Obra</th>
                <th>Cliente</th>
                <th>Tipo</th>
                <th class="amount">Honorarios</th>
                <th>Etapa</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <div id="view-clientes" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Agenda</p>
          <h1>Clientes</h1>
        </div>
      </div>
      <div class="clientes-grid" id="clientesGrid"></div>
    </div>

    <div id="view-arca" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Honorarios · comprobantes simulados</p>
          <h1>Facturación ARCA</h1>
        </div>
      </div>
      <div class="stats" id="arca-stats"></div>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Obra</th>
                <th>Cliente</th>
                <th class="amount">Honorarios</th>
                <th>Factura</th>
              </tr>
            </thead>
            <tbody id="arca-rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="arca-detail"></aside>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar un proyecto en Estudio Loma" data-subject="Consulta demo — Estudio Loma" data-title="Consultar un proyecto" data-place="panel"></script>
</body>
</html>
