<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Cuenta corriente</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../sistemas-ui/base.css?v=c2">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">
  <script src="../login.js?v=2" data-rubro="cuentacorriente" data-place="panel"></script>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="index.html"><strong>Cuenta corriente</strong><span>Panel de ejemplo</span></a>
      <nav>
        <a href="index.html">Qué es</a>
        <button class="btn" id="open-cliente" type="button">Nuevo cliente</button>
        <button class="btn" id="open-create" type="button">Nuevo movimiento</button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar"><div><p class="kicker">Datos de ejemplo</p><h1>Cuentas</h1></div></div>
    <p class="hint-bar"><strong>Ejemplo en el navegador.</strong> Clave de acceso: <strong>demo</strong>. <button type="button" id="reset-sample" style="margin-left:0.5rem;font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0.25rem 0.55rem">Restablecer ejemplo</button></p>
    <div class="thumb-row"><img src="img/local-1.jpg" alt=""><img src="img/local-2.jpg" alt=""><img src="img/local-3.jpg" alt=""></div>
    <div class="stats" id="stats"></div>
    <div class="filters-row" id="filters"></div>

    <form class="create" id="create-cliente" hidden>
      <label>Nombre<input name="nombre" required placeholder="Comercio o persona"></label>
      <label>Teléfono<input name="tel" placeholder="291…"></label>
      <button type="submit">Guardar cliente</button>
    </form>
    <form class="create" id="create" hidden>
      <label>Cliente
        <select name="clienteId"></select>
      </label>
      <label>Tipo
        <select name="tipo"><option value="cargo">Cargo</option><option value="pago">Pago</option></select>
      </label>
      <label>Monto<input name="monto" type="number" min="0" required></label>
      <label>Detalle<input name="detalle" required placeholder="Compra / cobro"></label>
      <button type="submit">Registrar</button>
    </form>
    <div class="workspace">
      <section class="list"><div class="table-scroll"><table>
        <thead><tr><th>Cliente</th><th>Tel</th><th class="amount">Saldo</th><th>Último</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div></section>
      <aside class="sheet" id="sheet"><p>Elija un cliente.</p></aside>
    </div>
  </div>
  <div id="contacto"></div>
  <footer class="wrap">Cuenta corriente · ejemplo · clave demo.</footer>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un sistema de cuenta corriente" data-subject="Consulta — Cuenta corriente" data-title="Consultar" data-place="panel"></script>
</body></html>
