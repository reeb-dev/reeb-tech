<body class="sys-cuentacorriente">
<header class="app-top">
  <a class="back" href="/demos/#sistemas-gestion">← Catálogo</a>
  <div><strong>Fiado del local</strong><span>Cargos, pagos y saldo</span></div>
  <a class="btn" href="panel.html">Panel completo</a>
</header>
<main id="app" class="app-shell"></main>
<script src="data.js"></script>
<script>

window.SIS_STORAGE_KEY = "sistema-cc-v3";
var seed = window.CC_SEED || {};
window.SIS_SEED = {
  items: (seed.clientes || []).map(function(c){
    var movs = (seed.movs || []).filter(function(m){ return m.clienteId === c.id; });
    var saldo = movs.reduce(function(a,m){ return a + (m.tipo==="pago" ? -Number(m.monto||0) : Number(m.monto||0)); }, 0);
    return { id: c.id, nombre: c.nombre, tel: c.tel, saldo: saldo, estado: saldo > 0 ? "debe" : "al_dia" };
  }),
  movs: seed.movs || []
};
window.SIS_CFG = {
  slug: "cuentacorriente", listKey: "items",
  statuses: ["al_dia","debe"],
  statusLabels: { al_dia:"Al día", debe:"Debe" },
  columns: [["nombre","Cliente"],["tel","Tel"],["saldo","Saldo"],["estado","Estado"]],
  form: [["nombre","Cliente","text"],["tel","Teléfono","text"],["saldo","Saldo","number"]],
  row: ["nombre","saldo","estado"]
};

</script>
<script src="../sistemas-ui/mini-app.js?v=c20"></script>
<script src="../wa-float.js?v=wa8"></script>
</body>
</html>
