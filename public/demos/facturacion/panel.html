<body class="panel-body">
  <script src="../login.js?v=4" data-rubro="facturacion" data-place="panel"></script>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="index.html"><strong>Libro</strong><span>Comprobantes de ejemplo</span></a>
      <nav>
        <a href="index.html">Qué es</a>
        <button class="btn" id="open-create" type="button">Nuevo comprobante</button>
      </nav>
    </div>
  </header>

  <div class="book">
    <div class="toolbar">
      <div>
        <p class="kicker">Montos de ejemplo</p>
        <h1>Libro de comprobantes</h1>
      </div>
      <label class="search-box">Buscar
        <input type="search" id="search" placeholder="Receptor, número, CUIT o CAE">
      </label>
    </div>

    <div class="totals" id="totals"></div>
    <div class="type-filters" id="typeFilters"></div>

    <form class="create" id="create">
      <label>Tipo
        <select name="type"></select>
      </label>
      <label>Número
        <input name="number" placeholder="0001-00000000" required>
      </label>
      <label>Receptor
        <input name="receptor" placeholder="Razón social de ejemplo" required>
      </label>
      <label>CUIT
        <input name="cuit" placeholder="30-00000000-0" required>
      </label>
      <label>Condición IVA
        <select name="ivaCond">
          <option>IVA Responsable Inscripto</option>
          <option>Consumidor Final</option>
          <option>Monotributo</option>
        </select>
      </label>
      <label>Monto
        <input name="amount" type="number" min="0" placeholder="Importe" required>
      </label>
      <label>Vencimiento
        <input name="due" type="date">
      </label>
      <label>Aviso de cobro
        <input name="aviso" placeholder="Ej. Enviar esta semana">
      </label>
      <label class="full">Detalle
        <input name="detalle" placeholder="Ítem del comprobante">
      </label>
      <button class="btn" type="submit">Cargar borrador</button>
    </form>

    <div class="workspace">
      <section class="list">
        <div class="table-scroll">
          <table class="ledger">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Número</th>
                <th>Receptor</th>
                <th class="amount">Monto</th>
                <th>Vencimiento</th>
                <th>CAE</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <aside class="sheet" id="sheet"></aside>
    </div>
  </div>

  <div id="contacto"></div>
  <footer class="wrap">Libro · ejemplo de página web · no emite comprobantes fiscales ni reemplaza un sistema de facturación.</footer>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=5" data-rubro="facturacion" data-place="panel"></script>
  <script src="../contacto.js?v=wa9" data-phone="5492915757934" data-text="Hola, vi el ejemplo de facturación y quiero consultar una página web a medida para mi local" data-subject="Consulta — página web (facturación)" data-title="Consultar" data-place="panel"></script>
</body>
