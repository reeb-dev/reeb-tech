<body>
  <script src="../login.js?v=4" data-rubro="excursiones" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">SENDEROS<small>Tornquist · panel</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <div class="panel-tabs">
            <button type="button" id="tab-salidas" class="on">Salidas</button>
            <button type="button" id="tab-pasajeros">Pasajeros</button>
            <button type="button" id="tab-guias">Guías</button>
          </div>
          <button class="btn" id="open-create" type="button">Nueva salida</button>
        </nav>
      </div>
    </header>

    <div id="view-salidas">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Cupos del día</p>
          <h1>Salidas</h1>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <form class="create" id="create">
        <select name="tour" required></select>
        <input name="fecha" type="date" required>
        <input name="hora" placeholder="Hora (07:00)" required>
        <select name="guia">
          <option>Laura</option>
          <option>Martín</option>
          <option>Sofía</option>
        </select>
        <button class="btn-panel" type="submit">Cargar salida</button>
      </form>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Salida</th>
                <th>Guía</th>
                <th>Cupo</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <div id="view-pasajeros" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Reservas web y mostrador</p>
          <h1>Pasajeros</h1>
        </div>
      </div>
      <div class="trabajos-grid" id="paxGrid"></div>
    </div>

    <div id="view-guias" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Equipo</p>
          <h1>Guías</h1>
        </div>
        <button class="btn" id="open-guia" type="button">Nuevo guía</button>
      </div>
      <form class="create" id="create-guia">
        <input name="nombre" placeholder="Nombre" required>
        <input name="corto" placeholder="Nombre corto" required>
        <input name="rol" placeholder="Rol">
        <input name="idiomas" placeholder="Idiomas">
        <select name="imagen">
          <option value="img/guia-laura.jpg">Foto 1</option>
          <option value="img/guia-martin.jpg">Foto 2</option>
          <option value="img/guia-sofia.jpg">Foto 3</option>
        </select>
        <textarea name="bio" placeholder="Bio"></textarea>
        <button class="btn-panel" type="submit">Guardar guía</button>
      </form>
      <div class="trabajos-grid" id="guiasGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=2" data-rubro="excursiones" data-place="panel"></script>
  <script src="../contacto.js?v=wa8" data-phone="5492915757934" data-text="Hola, vi el ejemplo de excursiones y quiero consultar una página web a medida para mi local" data-subject="Consulta — página web (excursiones)" data-title="Consultar una salida" data-place="panel"></script>
</body>
</html>
