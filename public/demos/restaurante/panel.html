<!doctype html>
<html lang="es">
<head>

  <title>Sistema · Restaurante</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <div class="top-inner">
        <a class="logo" href="index.html">RESTAURANTE<small>Gestión de salón · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
        </nav>
      </div>

      <div>
        <p class="eyebrow">Turno activo</p>
        <h1>Salón del restaurante</h1>
