<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Agenda de turnos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_sistemas/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">
  <script src="../login.js?v=2" data-rubro="turnos" data-place="panel"></script>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="index.html"><strong>Agenda</strong><span>Panel de ejemplo</span></a>
      <nav>
        <a href="index.html">Qué es</a>
        <button class="btn" id="open-create" type="button">Nuevo turno</button>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <div>
        <p class="kicker">Datos de ejemplo</p>
        <h1>Turnos del día</h1>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="filters-row" id="filters"></div>
    <form class="create" id="create" hidden>
      <label>Fecha<input name="fecha" type="date" required></label>
      <label>Hora<input name="hora" type="time" required></label>
      <label>Cliente<input name="cliente" required placeholder="Nombre"></label>
      <label>Teléfono<input name="tel" placeholder="291…"></label>
      <label>Profesional
        <select name="profesional"></select>
      </label>
      <label>Servicio<input name="servicio" required placeholder="Corte, control…"></label>
      <label class="full">Notas<input name="notas" placeholder="Opcional"></label>
      <button type="submit">Guardar turno</button>
    </form>
    <div class="workspace">
      <section class="list">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Prof.</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <aside class="sheet" id="sheet"><p>Elija un turno de la lista.</p></aside>
    </div>
  </div>

  <div id="contacto"></div>
  <footer class="wrap">Agenda · ejemplo · clave de acceso demo.</footer>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un sistema de turnos" data-subject="Consulta — Turnos" data-title="Consultar" data-place="panel"></script>
</body>
</html>
