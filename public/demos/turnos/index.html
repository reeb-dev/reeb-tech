<body class="sys-turnos">
<header class="app-top">
  <a class="back" href="/demos/#sistemas-gestion">← Catálogo</a>
  <div><strong>Agenda de hoy</strong><span>Horarios, profesionales y estados</span></div>
  <a class="btn" href="panel.html">Panel completo</a>
</header>
<main id="app" class="app-shell"></main>
<script src="data.js"></script>
<script>

window.SIS_STORAGE_KEY = "sistema-turnos-v3";
window.SIS_SEED = {
  items: (window.TURNOS_SEED.turnos || []).map(function(t){
    return Object.assign({}, t, { equipo: t.hora, detalle: t.notas || "" });
  }),
  clientes: window.TURNOS_SEED.clientes,
  profesionales: window.TURNOS_SEED.profesionales,
  servicios: window.TURNOS_SEED.servicios
};
window.SIS_CFG = {
  slug: "turnos", listKey: "items",
  statuses: ["pendiente","en_curso","atendido","ausente"],
  statusLabels: { pendiente:"Pendiente", en_curso:"En curso", atendido:"Atendido", ausente:"Ausente" },
  columns: [["hora","Hora"],["clienteId","Cliente"],["profesionalId","Profesional"],["estado","Estado"]],
  form: [["hora","Hora","text"],["fecha","Fecha","text"],["notas","Notas","text"]],
  row: ["hora","estado"]
};

</script>
<script src="../sistemas-ui/mini-app.js?v=c20"></script>
<script src="../wa-float.js?v=wa8"></script>
</body>
