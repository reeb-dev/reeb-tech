<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Kiosco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">KIOSCO<small>Stock y ventas · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo producto</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Stock del kiosco</h1>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="nombre" placeholder="Nombre del producto" required>
      <select name="categoria">
        <option value="golosinas">Golosinas</option>
        <option value="bebidas">Bebidas</option>
        <option value="cigarrillos">Cigarrillos</option>
        <option value="almacen">Almacén</option>
        <option value="limpieza">Limpieza</option>
        <option value="varios">Varios</option>
      </select>
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="stock" type="number" placeholder="Stock actual">
      <input name="minimo" type="number" placeholder="Stock mínimo">
      <input name="proveedor" placeholder="Proveedor">
      <button class="btn-panel" type="submit">Agregar producto</button>
    </form>

    <div class="workspace">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="amount">Precio</th>
              <th class="amount">Stock</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
