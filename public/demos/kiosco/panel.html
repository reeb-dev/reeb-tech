<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Kiosco Lo de Pedro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">LO DE PEDRO<small>Stock, ventas y fiado · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1 id="panelTitle">Stock del kiosco</h1>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="stock" class="on">Stock</button>
      <button type="button" data-tab="ventas">Ventas del día</button>
      <button type="button" data-tab="fiado">Fiado</button>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="nombre" placeholder="Nombre del producto" required>
      <select name="categoria">
        <option value="golosinas">Golosinas</option>
        <option value="bebidas">Bebidas</option>
        <option value="cigarrillos">Cigarrillos</option>
        <option value="snacks">Snacks</option>
      </select>
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="stock" type="number" placeholder="Stock actual">
      <input name="minimo" type="number" placeholder="Stock mínimo">
      <input name="proveedor" placeholder="Proveedor">
      <button class="btn-panel" type="submit">Agregar producto</button>
    </form>

    <form class="create" id="create-fiado">
      <input name="cliente" placeholder="Cliente" required>
      <input name="items" placeholder="Qué llevó">
      <input name="monto" type="number" placeholder="Monto" required>
      <button class="btn-panel" type="submit">Anotar fiado</button>
    </form>

    <div class="workspace" id="view-stock">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="amount">Precio</th>
              <th class="amount">Stock</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>

    <section class="panel-section" id="view-ventas" hidden>
      <p class="note" id="ventasNote"></p>
      <div id="ventas"></div>
    </section>

    <section class="panel-section" id="view-fiado" hidden>
      <p class="note">Libreta del barrio. No se muestra en la vidriera pública.</p>
      <div id="fiados"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por productos del kiosco Lo de Pedro" data-subject="Consulta demo — Kiosco Lo de Pedro" data-title="Escribinos" data-place="panel"></script>
</body>
</html>
