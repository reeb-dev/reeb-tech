<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Automotores</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="../login.js?v=1" data-rubro="automotores" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">
          <span class="logo-icon">🚗</span>
          <div>AUTOMOTORES<small>Gestión de stock · ejemplo</small></div>
        </a>
        <nav>
          <a href="index.html">Ver catálogo</a>
          <button class="btn" id="open-create" type="button">+ Nuevo vehículo</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1 id="panelTitle">Stock de vehículos</h1>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="stock" class="on">Stock</button>
      <button type="button" data-tab="consultas">Consultas</button>
      <button type="button" data-tab="arca">ARCA</button>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="codigo" placeholder="Código (ej: AUT-013)" required>
      <select name="marca" required>
        <option value="">Marca</option>
        <option value="Toyota">Toyota</option>
        <option value="Volkswagen">Volkswagen</option>
        <option value="Ford">Ford</option>
        <option value="Fiat">Fiat</option>
        <option value="Chevrolet">Chevrolet</option>
        <option value="Renault">Renault</option>
        <option value="Peugeot">Peugeot</option>
        <option value="Jeep">Jeep</option>
        <option value="Honda">Honda</option>
        <option value="Nissan">Nissan</option>
        <option value="Hyundai">Hyundai</option>
        <option value="Kia">Kia</option>
      </select>
      <input name="modelo" placeholder="Modelo" required>
      <input name="version" placeholder="Versión">
      <input name="ano" type="number" placeholder="Año" min="1990" max="2026" required>
      <select name="tipo">
        <option value="usado">Usado</option>
        <option value="0km">0 Km</option>
      </select>
      <input name="precioUSD" type="number" placeholder="Precio USD" required>
      <input name="km" type="number" placeholder="Kilómetros" value="0">
      <select name="combustible">
        <option value="nafta">Nafta</option>
        <option value="diesel">Diésel</option>
        <option value="gnc">GNC</option>
        <option value="hibrido">Híbrido</option>
        <option value="electrico">Eléctrico</option>
      </select>
      <select name="transmision">
        <option value="manual">Manual</option>
        <option value="automatica">Automática</option>
        <option value="cvt">CVT</option>
      </select>
      <input name="color" placeholder="Color">
      <input name="patente" placeholder="Patente (usados)">
      <button class="btn-panel" type="submit">Agregar vehículo</button>
    </form>

    <form class="create" id="create-consulta">
      <select name="vehiculoId" id="consulta-vehiculo" required></select>
      <input name="nombre" placeholder="Nombre" required>
      <input name="tel" placeholder="Teléfono">
      <input name="email" placeholder="Email">
      <input name="mensaje" placeholder="Consulta" required>
      <button class="btn-panel" type="submit">Registrar consulta</button>
    </form>

    <div class="workspace" id="view-stock">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Vehículo</th>
              <th>Tipo</th>
              <th>Año</th>
              <th class="amount">Precio USD</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>

    <div class="workspace" id="view-consultas" hidden>
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Vehículo</th>
              <th>Consulta</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="consulta-rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="consulta-detail"></aside>
    </div>

    <div class="workspace" id="view-arca" hidden>
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Vehículo</th>
              <th>Estado</th>
              <th class="amount">USD</th>
              <th>Factura</th>
            </tr>
          </thead>
          <tbody id="arca-rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="arca-detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=2" data-rubro="automotores" data-place="panel"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un vehículo" data-subject="Consulta — Automotores" data-title="Consultar un vehículo" data-place="panel"></script>
</body>
</html>
