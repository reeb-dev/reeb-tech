<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema · Biblioteca Pública Almagro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="../login.js?v=1" data-rubro="biblioteca" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">BIBLIOTECA<small>Gestión de préstamos · demo</small></a>
        <nav>
          <a href="index.html">Catálogo público</a>
        </nav>
      </div>
    </header>
    <div class="toolbar">
      <div>
        <p class="eyebrow">Sala · datos de ejemplo</p>
        <h1>Préstamos, socios y catálogo</h1>
      </div>
      <div class="toolbar-actions">
        <button class="ghost" id="nuevo-libro" type="button">Nuevo título</button>
        <button class="ghost" id="nuevo-socio" type="button">Nuevo socio</button>
        <button class="btn-panel" id="nuevo-prestamo" type="button">Nuevo préstamo</button>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="libros" class="on" type="button">Catálogo</button>
      <button data-tab="socios" type="button">Socios</button>
      <button data-tab="prestamos" type="button">Préstamos</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="workspace">
      <section class="list">
        <div class="table-wrap">
          <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
        </div>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>
  <footer class="panel-foot">Biblioteca Pública Almagro · demo de producto · no es una biblioteca en actividad.</footer>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=2" data-rubro="biblioteca" data-place="panel"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por préstamos o el catálogo" data-subject="Consulta demo — Biblioteca" data-title="Consultar" data-place="panel"></script>
</body>
</html>
