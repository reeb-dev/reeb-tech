<body>
  <script src="../login.js?v=1" data-rubro="biblioteca" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">BIBLIOTECA<small>Gestión de préstamos · ejemplo</small></a>
        <nav>
          <a href="index.html">Catálogo público</a>
        </nav>

    <div class="toolbar">
      <div>

        <h1>Préstamos, socios y catálogo</h1>
      </div>
      <div class="toolbar-actions">
        <button class="ghost" id="nuevo-libro" type="button">Nuevo título</button>

        <button class="btn-panel" id="nuevo-prestamo" type="button">Nuevo préstamo</button>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="libros" class="on" type="button">Catálogo</button>
      <button data-tab="socios" type="button">Socios</button>
      <button data-tab="prestamos" type="button">Préstamos</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="workspace">
      <section class="list">
        <div class="table-wrap">
          <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
        </div>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>
  <footer class="panel-foot">Biblioteca Pública Almagro · ejemplo de página web · no es una biblioteca en actividad.</footer>
