<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema · Biblioteca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">BIBLIOTECA<small>Gestión de préstamos · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="nuevo-prestamo" type="button">Nuevo préstamo</button>
        </nav>
      </div>
    </header>
    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Sistema de biblioteca</h1>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="libros" class="on">📚 Catálogo</button>
      <button data-tab="socios">👥 Socios</button>
      <button data-tab="prestamos">📋 Préstamos</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="workspace">
      <section class="list">
        <table><thead id="thead"></thead><tbody id="rows"></tbody></table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
