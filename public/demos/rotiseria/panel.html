<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema · Rotisería</title>
  <script>
    (function () {
      var p = location.pathname;
      if (p && p.charAt(p.length - 1) !== "/" && !/\.[a-zA-Z0-9]+$/.test(p)) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">ROTISERÍA<small>Producción y ventas · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="nuevo-pedido" type="button">Nuevo pedido</button>
        </nav>
      </div>
    </header>
    <div class="toolbar">
      <div>
        <p class="eyebrow">Turno activo</p>
        <h1>Sistema de rotisería</h1>
      </div>
      <div class="sucursal-bar" id="sucursal-chip"></div>
    </div>
    <div class="tabs">
      <button data-tab="pedidos" class="on">📝 Pedidos</button>
      <button data-tab="produccion">🍗 Producción</button>
      <button data-tab="ingredientes">📦 Ingredientes</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="workspace">
      <section class="list" id="list-area"></section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por un pedido o delivery" data-subject="Consulta demo — Rotisería" data-title="Hacer un pedido" data-place="panel"></script>
</body>
</html>
