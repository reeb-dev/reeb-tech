<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Inmobiliaria</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">INMOBILIARIA<small>Gestión de propiedades · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nueva propiedad</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Cartera de propiedades</h1>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="titulo" placeholder="Título" required>
      <select name="tipo">
        <option value="departamento">Departamento</option>
        <option value="casa">Casa</option>
        <option value="ph">PH</option>
        <option value="local">Local comercial</option>
        <option value="oficina">Oficina</option>
        <option value="terreno">Terreno</option>
      </select>
      <select name="operacion">
        <option value="alquiler">Alquiler</option>
        <option value="venta">Venta</option>
      </select>
      <input name="direccion" placeholder="Dirección">
      <input name="barrio" placeholder="Barrio">
      <input name="ambientes" type="number" placeholder="Ambientes">
      <input name="superficie" type="number" placeholder="Superficie m²">
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="expensas" type="number" placeholder="Expensas">
      <button class="btn-panel" type="submit">Agregar propiedad</button>
    </form>

    <div class="workspace">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Código</th>
              <th>Propiedad</th>
              <th>Operación</th>
              <th>Barrio</th>
              <th class="amount">Precio</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por una propiedad" data-subject="Consulta demo — Inmobiliaria" data-title="Consultar una propiedad" data-place="panel"></script>
</body>
</html>
