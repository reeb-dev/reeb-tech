<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Inmobiliaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-page">
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">
          <span class="logo-mark" aria-hidden="true"></span>
          <span>Inmobiliaria<small>Gestión de propiedades · demo</small></span>
        </a>
        <details class="mobile-menu">
          <summary>Menú</summary>
          <a href="index.html">Vitrina</a>
          <a href="#contacto">Contacto</a>
        </details>
        <nav id="siteNav">
          <a href="index.html">Vitrina</a>
        </nav>
        <button class="btn" id="open-create" type="button">Nueva propiedad</button>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Cartera de propiedades</h1>
        <p class="lead-panel">Visitas al anuncio y consultas se ven acá, no en la vitrina.</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="titulo" placeholder="Título" required>
      <select name="tipo">
        <option value="departamento">Departamento</option>
        <option value="casa">Casa</option>
        <option value="ph">PH</option>
        <option value="local">Local comercial</option>
        <option value="oficina">Oficina</option>
        <option value="terreno">Terreno</option>
      </select>
      <select name="operacion">
        <option value="alquiler">Alquiler</option>
        <option value="venta">Venta</option>
      </select>
      <input name="direccion" placeholder="Dirección">
      <input name="barrio" placeholder="Barrio">
      <input name="ambientes" type="number" placeholder="Ambientes">
      <input name="superficie" type="number" placeholder="Superficie m²">
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="expensas" type="number" placeholder="Expensas">
      <button class="btn-panel" type="submit">Agregar propiedad</button>
    </form>

    <div class="workspace">
      <section class="list">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Código</th>
                <th>Propiedad</th>
                <th>Operación</th>
                <th>Barrio</th>
                <th class="amount">Precio</th>
                <th class="amount">Visitas</th>
                <th class="amount">Consultas</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>

    <div class="panel-contact wrap" id="contacto"></div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por una propiedad" data-subject="Consulta demo — Inmobiliaria" data-title="Consultar una propiedad" data-place="panel"></script>
  <link rel="stylesheet" href="styles.css">
</body>
</html>
