<body>
  <script src="../login.js?v=4" data-rubro="steelframe" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">Framehaus<small>Obras · panel</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <div class="panel-tabs">
            <button type="button" id="tab-obras" class="on">Obras</button>
            <button type="button" id="tab-modelos">Modelos</button>
            <button type="button" id="tab-arca">ARCA</button>
          </div>
          <button class="btn" id="open-create" type="button">Nueva obra</button>
        </nav>
      </div>
    </header>

    <div id="view-obras">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Datos de ejemplo</p>
          <h1>Obras en curso</h1>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <form class="create" id="create">
        <input name="cliente" placeholder="Nombre cliente" required>
        <input name="tel" placeholder="Teléfono">
        <select name="tipo"></select>
        <input name="lote" placeholder="Lote / dirección">
        <button class="btn-panel" type="submit">Crear obra</button>
      </form>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Obra</th>
                <th>Cliente</th>
                <th>Modelo</th>
                <th class="amount">Precio</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <div id="view-modelos" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Catálogo de la landing</p>
          <h1>Modelos publicados</h1>
        </div>
        <button class="btn" id="open-modelo" type="button">Nuevo modelo</button>
      </div>
      <form class="create" id="create-modelo">
        <input name="nombre" placeholder="Nombre" required>
        <select name="tipo"></select>
        <input name="m2" type="number" placeholder="m²" required>
        <input name="precio" type="number" placeholder="Precio" required>
        <input name="plazo" placeholder="Plazo, ej. 90 días de obra" required>
        <input name="sistema" placeholder="Sistema, ej. Steel frame + siding">
        <input name="ambientes" placeholder="Ambientes" class="full-span">
        <textarea name="descripcion" placeholder="Descripción" class="full-span"></textarea>
        <select name="imagen"></select>
        <label class="check-inline"><input type="checkbox" name="publicado" checked> Publicado</label>
        <button class="btn-panel" type="submit">Guardar modelo</button>
      </form>
      <div class="modelos-grid" id="modelosGrid"></div>
    </div>

    <div id="view-arca" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Comprobantes simulados</p>
          <h1>Facturación ARCA</h1>
        </div>
      </div>
      <div class="stats" id="arca-stats"></div>
      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Obra</th>
                <th>Cliente</th>
                <th class="amount">Total</th>
                <th>Factura</th>
              </tr>
            </thead>
            <tbody id="arca-rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="arca-detail"></aside>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=4" data-rubro="steelframe" data-place="panel"></script>
  <script src="../contacto.js?v=wa9" data-phone="5492915757934" data-text="Hola, vi el ejemplo de steel frame y quiero consultar una página web a medida para mi local" data-subject="Consulta — página web (steel frame)" data-title="Consultar un modelo" data-place="panel"></script>
</body>
</html>
