<body class="sys-cotizaciones">
<header class="app-top">
  <a class="back" href="/demos/#sistemas-gestion">← Catálogo</a>
  <div><strong>Presupuestos</strong><span>Del borrador al pedido</span></div>
  <a class="btn" href="panel.html">Panel completo</a>
</header>
<main id="app" class="app-shell"></main>
<script src="data.js"></script>
<script>

window.SIS_STORAGE_KEY = "sistema-cotizaciones-v3";
var seed = window.COTIZ_SEED || {};
window.SIS_SEED = {
  items: (seed.cotizaciones || []).map(function (c) {
    var cli = (seed.clientes || []).filter(function (x) { return x.id === c.clienteId; })[0] || {};
    var total = (c.items || []).reduce(function (a, i) { return a + Number(i.monto || 0) * Number(i.cant || 1); }, 0);
    return {
      id: c.id,
      cliente: cli.nombre || "Cliente",
      total: total,
      detalle: (c.items || []).map(function (i) { return i.nombre; }).join(", "),
      estado: c.estado === "enviada" ? "enviado" : c.estado === "aceptada" ? "aceptado" : c.estado === "pedido" ? "aceptado" : c.estado
    };
  }),
  clientes: seed.clientes || []
};
window.SIS_CFG = {
  slug: "cotizaciones", listKey: "items",
  statuses: ["borrador", "enviado", "aceptado", "rechazado"],
  statusLabels: { borrador: "Borrador", enviado: "Enviado", aceptado: "Aceptado", rechazado: "Rechazado" },
  columns: [["cliente", "Cliente"], ["detalle", "Detalle"], ["total", "Total"], ["estado", "Estado"]],
  form: [["cliente", "Cliente", "text"], ["detalle", "Detalle", "text"], ["total", "Total", "number"]],
  row: ["cliente", "estado", "total"]
};

</script>
<script src="../sistemas-ui/mini-app.js?v=c20"></script>
<script src="../wa-float.js?v=wa8"></script>
</body>
</html>
