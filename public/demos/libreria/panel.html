<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Librería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">LIBRERÍA<small>Libros y útiles · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo producto</button>
        </nav>
      </div>
    </header>
    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Catálogo de productos</h1>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="nombre" placeholder="Nombre" required>
      <select name="categoria">
        <option value="libros">Libros</option>
        <option value="utiles">Útiles escolares</option>
        <option value="papeleria">Papelería</option>
        <option value="arte">Arte</option>
        <option value="tecnologia">Tecnología</option>
      </select>
      <input name="autor" placeholder="Autor (libros)">
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="stock" type="number" placeholder="Stock">
      <input name="proveedor" placeholder="Proveedor">
      <button class="btn-panel" type="submit">Agregar</button>
    </form>
    <div class="workspace">
      <section class="list">
        <table>
          <thead><tr><th>Código</th><th>Producto</th><th>Cat.</th><th class="amount">Precio</th><th class="amount">Stock</th><th>Estado</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por un libro o un pedido" data-subject="Consulta demo — Librería" data-title="Consultar un libro" data-place="panel"></script>
</body>
</html>
