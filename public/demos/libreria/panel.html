<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Librería Rivadavia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">LIBRERÍA RIVADAVIA<small>Libros · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo producto</button>
        </nav>
      </div>
    </header>
    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Catálogo, encargos y ventas</h1>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="inventario" class="on">Inventario</button>
      <button type="button" data-tab="pedidos">Pedidos especiales</button>
      <button type="button" data-tab="ventas">Ventas</button>
    </div>
    <div class="stats" id="stats"></div>
    <form class="create" id="create">
      <input name="codigo" placeholder="Código" required>
      <input name="nombre" placeholder="Nombre" required>
      <select name="categoria">
        <option value="ficcion">Ficción</option>
        <option value="ensayo">Ensayo</option>
        <option value="infantil">Infantil</option>
        <option value="historieta">Historieta</option>
        <option value="clasico">Clásico</option>
        <option value="utiles">Útiles escolares</option>
        <option value="papeleria">Papelería</option>
      </select>
      <input name="autor" placeholder="Autor (libros)">
      <input name="precio" type="number" placeholder="Precio" required>
      <input name="stock" type="number" placeholder="Stock">
      <input name="proveedor" placeholder="Proveedor">
      <button class="btn-panel" type="submit">Agregar</button>
    </form>
    <div class="workspace" id="view-inventario">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Código</th>
              <th>Producto</th>
              <th>Cat.</th>
              <th class="amount">Precio</th>
              <th class="amount">Stock</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
    <section class="panel-section" id="view-pedidos" hidden>
      <p class="note">Encargos del catálogo (título, autor, contacto). Quedan en este navegador.</p>
      <div id="pedidos"></div>
    </section>
    <section class="panel-section" id="view-ventas" hidden>
      <p class="note">Ventas del mostrador y de ARCA. Miniatura de cada título.</p>
      <div id="ventas"></div>
    </section>
  </div>
  <script src="../contacto.js" data-phone="5491140001234" data-text="Hola, quiero consultar por un libro del catálogo" data-subject="Consulta demo — Librería" data-title="Consultar un título" data-place="panel"></script>
  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
