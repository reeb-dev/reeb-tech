<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Salón Camelia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="../login.js?v=1" data-rubro="peluqueria" data-place="panel"></script>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">CAMELIA<small>Salón · panel</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <div class="panel-tabs">
            <button type="button" id="tab-agenda" class="on">Agenda</button>
            <button type="button" id="tab-clientes">Clientes</button>
            <button type="button" id="tab-servicios">Servicios</button>
          </div>
          <button class="btn" id="open-create" type="button">Nuevo turno</button>
        </nav>
      </div>
    </header>

    <div id="view-agenda">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Datos de ejemplo</p>
          <h1>Agenda de turnos</h1>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <form class="create" id="create">
        <input name="fecha" placeholder="Fecha (ej: 8 sep)" required>
        <input name="hora" placeholder="Hora (ej: 10:00)" required>
        <input name="cliente" placeholder="Nombre cliente" required>
        <input name="tel" placeholder="Teléfono">
        <select name="profesional">
          <option value="Lucía">Lucía</option>
          <option value="Diego">Diego</option>
          <option value="Yamila">Yamila</option>
        </select>
        <select name="servicio">
          <option value="">Sin servicio aún</option>
        </select>
        <input name="notas" placeholder="Notas">
        <button class="btn-panel" type="submit">Reservar turno</button>
      </form>

      <div class="workspace">
        <section class="list">
          <table>
            <thead>
              <tr>
                <th>Turno</th>
                <th>Cliente</th>
                <th>Servicios</th>
                <th>Prof.</th>
                <th class="amount">Total</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
        <aside class="detail" id="detail"></aside>
      </div>
    </div>

    <div id="view-clientes" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Ficha del salón</p>
          <h1>Clientes</h1>
        </div>
        <button class="btn" id="open-cliente" type="button">Nuevo cliente</button>
      </div>

      <form class="create" id="create-cliente">
        <input name="nombre" placeholder="Nombre" required>
        <input name="tel" placeholder="Teléfono">
        <input name="email" placeholder="Email">
        <select name="profesional">
          <option value="Lucía">Lucía</option>
          <option value="Diego">Diego</option>
          <option value="Yamila">Yamila</option>
        </select>
        <input name="notas" placeholder="Notas">
        <button class="btn-panel" type="submit">Guardar cliente</button>
      </form>

      <div class="trabajos-grid" id="clientesGrid"></div>
    </div>

    <div id="view-servicios" class="panel-hidden">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Carta de la landing</p>
          <h1>Servicios publicados</h1>
        </div>
        <button class="btn" id="open-servicio" type="button">Nuevo servicio</button>
      </div>

      <form class="create" id="create-servicio">
        <input name="label" placeholder="Nombre" required>
        <select name="categoria">
          <option value="cabello">Cabello</option>
          <option value="color">Color</option>
          <option value="uñas">Uñas</option>
        </select>
        <input name="precio" type="number" placeholder="Precio" required>
        <input name="duracion" type="number" placeholder="Minutos" required>
        <select name="profesional">
          <option value="Lucía">Lucía</option>
          <option value="Diego">Diego</option>
          <option value="Yamila">Yamila</option>
        </select>
        <select name="imagen">
          <option value="img/corte-dama.jpg">Corte dama</option>
          <option value="img/corte-caballero.jpg">Corte caballero</option>
          <option value="img/barba.jpg">Barba</option>
          <option value="img/tintura.jpg">Tintura</option>
          <option value="img/mechas.jpg">Mechas</option>
          <option value="img/brushing.jpg">Brushing</option>
          <option value="img/alisado.jpg">Alisado</option>
          <option value="img/tratamiento.jpg">Tratamiento</option>
          <option value="img/peinado.jpg">Peinado</option>
          <option value="img/manicura.jpg">Manicura</option>
          <option value="img/pedicura.jpg">Semipermanente</option>
        </select>
        <textarea name="descripcion" placeholder="Descripción"></textarea>
        <button class="btn-panel" type="submit">Guardar servicio</button>
      </form>

      <div class="trabajos-grid" id="serviciosGrid"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../difusion.js?v=2" data-rubro="peluqueria" data-place="panel"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un turno en Salón Camelia" data-subject="Consulta demo — Peluquería Camelia" data-title="Reservar un turno" data-place="panel"></script>
</body>
</html>
