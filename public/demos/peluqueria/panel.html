<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · Peluquería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-inner">
        <a class="logo" href="index.html">PELUQUERÍA<small>Turnos y servicios · demo</small></a>
        <nav>
          <a href="index.html">Inicio</a>
          <button class="btn" id="open-create" type="button">Nuevo turno</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div>
        <p class="eyebrow">Datos de ejemplo</p>
        <h1>Agenda del día</h1>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <form class="create" id="create">
      <input name="fecha" placeholder="Fecha (ej: 8 sep)" required>
      <input name="hora" placeholder="Hora (ej: 10:00)" required>
      <input name="cliente" placeholder="Nombre cliente" required>
      <input name="tel" placeholder="Teléfono">
      <select name="profesional">
        <option value="Lucía">Lucía</option>
        <option value="Diego">Diego</option>
        <option value="Yamila">Yamila</option>
      </select>
      <input name="notas" placeholder="Notas">
      <button class="btn-panel" type="submit">Reservar turno</button>
    </form>

    <div class="workspace">
      <section class="list">
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Cliente</th>
              <th>Servicios</th>
              <th>Prof.</th>
              <th class="amount">Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <aside class="detail" id="detail"></aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="panel.js"></script>
</body>
</html>
