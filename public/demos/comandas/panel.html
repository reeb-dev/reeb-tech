<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Comandas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_sistemas/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel-body">
  <script src="../login.js?v=2" data-rubro="comandas" data-place="panel"></script>
  <header class="band">
    <div class="band-inner">
      <a class="brand" href="index.html"><strong>Comandas</strong><span>Panel de ejemplo</span></a>
      <nav>
        <a href="index.html">Qué es</a>
        <button class="btn" id="open-create" type="button">Abrir mesa</button>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar"><div><p class="kicker">Datos de ejemplo</p><h1>Mesas y comandas</h1></div></div>
    <div class="stats" id="stats"></div>
    <div class="filters-row" id="filters"></div>

    <form class="create" id="create" hidden>
      <label>Mesa<input name="mesa" required placeholder="Mesa 4"></label>
      <label>Ítem<input name="item" required placeholder="Bife + guarnición"></label>
      <label>Monto<input name="monto" type="number" min="0" required></label>
      <label>Notas<input name="notas" placeholder="Sin sal / punto"></label>
      <button type="submit">Abrir / agregar</button>
    </form>
    <div class="workspace">
      <section class="list"><div class="table-scroll"><table>
        <thead><tr><th>Mesa</th><th>Ítems</th><th class="amount">Total</th><th>Estado</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div></section>
      <aside class="sheet" id="sheet"><p>Elija una mesa.</p></aside>
    </div>
  </div>
  <div id="contacto"></div>
  <footer class="wrap">Comandas · ejemplo · clave demo.</footer>
  <script src="data.js"></script>
  <script src="panel.js"></script>
  <script src="../contacto.js" data-phone="5492915757934" data-text="Hola, quiero consultar por un sistema de comandas" data-subject="Consulta — Comandas" data-title="Consultar" data-place="panel"></script>
</body></html>
