<body class="sys-comandas">
<header class="app-top">
  <a class="back" href="/demos/#sistemas-gestion">← Catálogo</a>
  <div><strong>Salón en vivo</strong><span>Mesas, cocina y cobro</span></div>
  <a class="btn" href="panel.html">Panel completo</a>
</header>
<main id="app" class="app-shell"></main>
<script src="data.js"></script>
<script>

window.SIS_STORAGE_KEY = "sistema-comandas-v3";
window.SIS_SEED = {
  items: (window.COMANDAS_SEED.mesas || []).map(function(m){
    return {
      id: m.id, nombre: m.mesa, estado: m.estado, cubiertos: m.cubiertos,
      detalle: (m.items||[]).map(function(i){return i.nombre;}).join(", "),
      mozo: m.mozo, total: (m.items||[]).reduce(function(a,i){return a+(i.monto||0);},0)
    };
  }),
  carta: window.COMANDAS_SEED.carta
};
window.SIS_CFG = {
  slug: "comandas", listKey: "items",
  statuses: ["abierta","cocina","lista","cerrada"],
  statusLabels: { abierta:"Abierta", cocina:"Cocina", lista:"Lista", cerrada:"Cerrada" },
  columns: [["nombre","Mesa"],["cubiertos","Pers."],["detalle","Pedidos"],["estado","Estado"],["total","Total"]],
  form: [["nombre","Mesa","text"],["cubiertos","Cubiertos","number"],["detalle","Pedidos","text"]],
  row: ["nombre","estado","detalle"]
};

</script>
<script src="../sistemas-ui/mini-app.js?v=c20"></script>
<script src="../wa-float.js?v=wa8"></script>
</body>
</html>
